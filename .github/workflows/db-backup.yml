name: Daily Database Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Chaque jour à 02h00 UTC (03h00 Maroc)
  workflow_dispatch:        # Permet de lancer manuellement depuis GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 18 client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
        run: |
          DATE=$(date +%Y-%m-%d)
          /usr/lib/postgresql/18/bin/pg_dump "${DATABASE_URL}?sslmode=require" \
            --no-password \
            --format=custom \
            --file="backup-aoz-${DATE}.dump"
          echo "Backup créé : backup-aoz-${DATE}.dump"
          ls -lh "backup-aoz-${DATE}.dump"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup-aoz-*.dump
          retention-days: 90
